spring.application.name=account-lockout-java

# 失败计数与锁定状态持久化文件（本地 JSON，原子写入）
lockout.storage-file=data/lockout-state.json

# 账户维度：滑动窗口 / 阈值 / 分级锁定时长（逐级延长）
lockout.account.window=5m
lockout.account.threshold=5
lockout.account.levels[0]=1m
lockout.account.levels[1]=5m
lockout.account.levels[2]=30m

# 来源维度：滑动窗口 / 阈值（仅拒绝该来源，不锁账户）
lockout.source.window=5m
lockout.source.threshold=10

# 最小凭据存储（用户名=密码），仅用于演示
lockout.users.alice=password123
lockout.users.bob=hunter2

# 人工解锁 / 审计查询所需的管理员令牌
lockout.admin-tokens[0]=admin-secret-token
